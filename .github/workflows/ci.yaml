name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  prek:
    runs-on: ghcr.io/j178/prek:v0.3.1
    steps:
    - uses: actions/checkout@v3
    - name: prek
      run: prek

  build-lib:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: make
      run: make lib_asm

  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: make
      run: make test
